<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인 태그</title>
  </head>
  <body>
    <!-- 제목, 헤드라인, h1~h6 -->
    <!-- 시각적 의미와 별개로 내용적 의미도 있음 -->
    <h1>헤드라인1</h1>
    <!-- h1이 가장 큰 것 -->
    <h2>헤드라인2</h2>
    <h3>헤드라인3</h3>
    <!-- 여기까지만..왜? 마크다운 -> h3까지만 대응해서 지원 -->
    <!-- #, ##, ### -->
    <h4>헤드라인4</h4>
    <h5>헤드라인5</h5>
    <h6>헤드라인6</h6>
    <!-- 시각적 차이뿐만 아니라 검색 엔진, AI는 이 h들을 우선적으로 검색 -->

    <!-- 텍스트가 들어가도 '문단'을 구분하는 태그 안에 있는게 아니면 붙여서 표현 = enter가 먹지 않음 -->
    <!-- 줄 바꿈 br 자기 완결성 가짐-->
    이렇게 직접 씁니까? <br />

    <!-- parsing -> 그 역할만 하게 하고 화면이 표시하지 x-->
    <p>문단을 의미</p>
    <p>확실히 구분되지 위해 위 아래 여백으로 구분</p>
    <p>확실히 구분되지 위해 위 아래 여백으로 구분</p>
    <p>p 태그는 br과 혼용 가능</p>
    <p>태그의 경우에는 일반 문장에서 넣으면 요소 취급</p>
    <!-- <br />을 <p> 태그 안에 그냥 넣으면 문자열이 아닌 태그로 적용됨-->
    <!-- 엔터티(&lt; &gt;)를 통해서 표현, js를 통해서 표현-->

    <!-- shift + enter : 문단 내 줄바꿈-->
    <!--hr : 가로 구분선-->
    <hr />
    <p>가로 구분선(hr)</p>
    <!-- 요새는 html 태그를 어떻게 배우는가? -->
    <!-- 내가 만들고 싶은 화면이 생김 -> AI를 통해서 생성 -> 대표적으로 쓰는 태그로 생성 -> 그 코드를 내가 읽음 -> 내가 쓰고 싶은 태그를 발견/저장-->

    <!--HTML5 <- HTML1~4-->
    <!-- HTML5는 가능하면 화면을 꾸미는 태그들은 덜 쓰고, CSS에게 맡기자-->
    <p>
      strong
      <strong>강조</strong>
      볼드 처리
      <!-- em, b, ...? -->
      <em>이탤릭체</em>
      <i>이탤릭체</i>
      <!--태그 자체의 스타일을 사용하는 건 극히 일부-->
      <span style="font=style: italic">이탤릭체</span>
      <!-- 딱히 의미론적으로는 기능이 없다... -->
      <!-- 정 꾸미는게 필요하다면 CSS를 사용한다-->
    </p>
    <br /><br /><br />

    <!--순서가 있는 목록-->
    <!--order(순서) + list(목록) -->
    <ol>
      <li>세수하기</li>
      <li>양치하기</li>
      <li>커피 마시기</li>
      <!--shift + 방향키 : 범위 지정 -->
      <!--범위 지정 후 alt + 방향키 : 지정 범위 이동 -->
      <!--범위 지정 후 alt + shift + 방향키 : 지정 범위 복사 -->
    </ol>
    <!--순서가 없는 목록-->
    <!--unorder(순서없음) + list(목록) -->
    <ul>
      <li>로또 사기</li>
      <li>주식 가격 보기</li>
      <li>연금복권 사기</li>
    </ul>
    <!-- 숫자 같은 디자인은 태그로 바꿀 수도 있으나 요새는 CSS로 수정한다-->

    <!-- 링크 : HTML -> HyperText Markup Language -->
    <a>링크</a>
    <!-- href / hypertext reference -->
    <!-- 큰따옴포, 작은따옴표 관계없이 무조건 속성에 들어가는 값은 '', ""로 묶여있는 문자열 취급 -->
    <a href="https://google.com">링크</a>
    <a href="https://google.com" target="_blank">새 창으로</a>
    <!-- 다른 html 문서나 외부에 있는 웹 주소로 연결해주는 기능-->
    <!-- 이미지 -->
    <!-- <tag /> 닫힌 태그 -->
    <!-- <tag></tag> 열린 태그 -->
    <br />
    <img
      src="https://picsum.photos/400/200"
      alt="랜덤 이미지"
      title="커서를 올리면"
    /><br />
    <img src="주소인척" alt="깨진 이미지" />
    <br /><br /><br />
  </body>
</html>
