<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 선택자</title>
    <style>
      /*태그 선택자*/
      /*태그명{프로퍼티명 : 프로퍼티값;}*/
      p {
        color: gray;
      }

      /*클래스 선택자*/
      /*.클래스명{프로퍼티명 : 프로퍼티값;}*/
      .class-style {
        color: green;
      }

      /*.클래스는 같은 태그에 2개 이상 부여 가능*/
      .class-style2 {
        color: red;
      }
      /*id 선택자*/
      /*#id명{프로퍼티명 : 프로퍼티값;}*/
      #id-style {
        color: yellow;
      }

      .class-style3 {
        color: blue;
      }
    </style>
  </head>
  <body>
    <p>태그 선택자</p>
    <!--emmet-->
    <!--p.class-style-->
    <!--케밥 스타일 -> kebaba-style-->
    <p class="class-style">클래스 선택자</p>
    <p class="class-style class-style2 class-style3">클래스 선택자</p>
    <p id="id-style" class="class-style2">id 선택자</p>
    <p style="color: brown" id="id-style" class="class-style2">id 선택자</p>
  </body>
</html>
