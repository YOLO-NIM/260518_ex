<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼 실습</title>
  </head>
  <body>
    <img src="https://picsum.photos/400/200" />
    <h1>회원 가입 양식</h1>
    <!-- 기본적인 input -->
    <h2>그냥 인풋</h2>
    <input />
    <button>제출</button>
    <h2>폼 인풋</h2>
    <!--주소창에 데이터를 전달하는 방식 : get-->
    <!--<form action="" method="get">-->
    <form action="https://search.naver.com/search.naver" method="get"></form>
    <form>
      <!-- form으로 묶으면 하위Input에서 enter치면 제출 처리(혹은 버튼 누르면)-->
      <!-- input에 name 안 붙여주면 주소창을 통해 전달 X-->
      <input /><br />
      <!-- for는 name이 아니라 id-->
      <!-- name은 form당 1개, id는 전체 파일당 1개로 권장-->
      <!--1번 방식-->
      <label for="username">유저이름 : </label
      ><input name="username" id="username" /> <br />
      <!--2번 방식-->
      <label>유저이름 : <input name="username" /> </label> <br />

      <label for="password">비밀번호 : </label>
      <input
        name="password"
        id="password"
        type="password"
        placeholder="암호를 입력해주세요"
      />
      <hr />
      <!--큰 text input 여러줄 -->
      <textarea name="long text"></textarea>
      <input type="radio" name="gender" /> 남성
      <input type="radio" name="gender" /> 여성
      <select name="city">
        <option>서울</option>
        <option>부산</option>
        <option>대전</option>
      </select>
      <input type="checkbox" name="hobby" value="1" /> 취미1
      <input type="checkbox" name="hobby" value="2" /> 취미2

      <input type="color" />
      <input type="date" />
      <br />

      <!-- 둘이 실질적으로 같음 -->
      <input type="button" value="버튼" />

      <button type="submit">제출</button>
    </form>
  </body>
</html>
